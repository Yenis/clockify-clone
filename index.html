<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Time Tracker</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 36'%3E%3Crect width='36' height='36' rx='10' fill='%23bfe3cf'/%3E%3Cg fill='none' stroke='%2316382a' stroke-width='2.4' stroke-linecap='round'%3E%3Ccircle cx='18' cy='20' r='9'/%3E%3Cpath d='M15 7.5h6M18 7.5v3.5M18 20l3.5-3.5M26 12.5l1.5-1.5'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app-header">
    <div class="app-header-inner">
      <div class="brand">
        <svg class="brand-logo" viewBox="0 0 36 36" aria-hidden="true">
          <rect width="36" height="36" rx="10" fill="#bfe3cf"/>
          <g fill="none" stroke="#16382a" stroke-width="2.4" stroke-linecap="round">
            <circle cx="18" cy="20" r="9"/>
            <path d="M15 7.5h6M18 7.5v3.5M18 20l3.5-3.5M26 12.5l1.5-1.5"/>
          </g>
        </svg>
        <h1>Time Tracker</h1>
      </div>
      <nav class="app-nav" aria-label="Pages">
        <a href="#timer" data-page-link="timer">Timer <span id="nav-clock" class="nav-clock" hidden></span></a>
        <a href="#reports" data-page-link="reports">Reports</a>
      </nav>
    </div>
  </header>

  <main class="app">
    <div id="page-timer" class="page" data-page="timer">
      <section id="timer-bar" class="timer-bar card" aria-label="Timer">
        <input id="description" class="timer-description" type="text"
               placeholder="What are you working on?" autocomplete="off">
        <input id="tag" class="timer-tag" type="text" list="tag-options"
               placeholder="Tag" aria-label="Tag" autocomplete="off">
        <span id="clock" class="timer-clock">0:00:00</span>
        <button id="start-stop" class="button button-primary" type="button">Start</button>
      </section>

      <details class="manual-entry">
        <summary>Add an entry by hand</summary>
        <form id="manual-form" class="manual-form card" novalidate>
          <label class="manual-description">
            Description
            <input name="description" data-field="description" type="text" class="edit-field" autocomplete="off"
                   placeholder="What did you work on?">
          </label>
          <label class="manual-tag">
            Tag
            <input name="tag" data-field="tag" type="text" class="edit-field" list="tag-options"
                   autocomplete="off" placeholder="Optional">
          </label>
          <label>
            Date
            <input name="date" data-field="date" type="date" class="edit-field">
          </label>
          <label>
            Start
            <input name="start" data-field="start" type="time" class="edit-field">
          </label>
          <label>
            End
            <input name="end" data-field="end" type="time" class="edit-field">
          </label>
          <button class="button button-primary" type="submit">Add</button>
          <p id="manual-error" class="form-error" role="alert" hidden></p>
        </form>
      </details>

      <section class="entries" aria-label="Entries">
        <div class="entries-header">
          <h2>Entries</h2>
          <p class="today-total">Today <strong id="today-total">0:00:00</strong></p>
        </div>
        <p id="empty-message" class="empty-message card">No entries yet.</p>
        <table id="entries-table" class="entries-table card" hidden>
          <tbody id="entries-body"></tbody>
        </table>
      </section>
    </div>

    <div id="page-reports" class="page" data-page="reports" hidden>
      <h2 class="page-title">Reports</h2>

      <section class="report card" aria-labelledby="week-title">
        <div class="report-header">
          <div>
            <h3 id="week-title" class="report-title">This week</h3>
            <p id="week-range" class="report-range"></p>
          </div>
          <div class="week-nav">
            <button id="previous-week" class="button button-small" type="button" aria-label="Previous week">&larr;</button>
            <button id="this-week" class="button button-small" type="button">This week</button>
            <button id="next-week" class="button button-small" type="button" aria-label="Next week">&rarr;</button>
          </div>
        </div>
        <p class="report-total">Week total <strong id="week-total">0:00:00</strong></p>
        <ol id="week-days" class="week-days"></ol>
      </section>

      <section class="report card" aria-labelledby="tags-title">
        <h3 id="tags-title" class="report-title">Time per tag</h3>
        <p id="tags-range" class="report-range"></p>
        <p id="tags-empty" class="report-empty" hidden>No entries in this week.</p>
        <ol id="tag-totals" class="week-days tag-totals"></ol>
      </section>

      <section class="report card" aria-labelledby="export-title">
        <h3 id="export-title" class="report-title">Export to CSV</h3>
        <p class="report-range">A file for Excel or Google Sheets, with the finished entries between two dates.</p>
        <form id="export-form" class="export-form" novalidate>
          <label>
            From
            <input name="from" data-field="from" type="date" class="edit-field">
          </label>
          <label>
            To
            <input name="to" data-field="to" type="date" class="edit-field">
          </label>
          <label class="export-separator">
            For
            <select name="separator" class="edit-field">
              <option value=";">Excel with Bosnian or European settings (;)</option>
              <option value=",">Google Sheets, or Excel with English settings (,)</option>
            </select>
          </label>
          <button class="button button-primary" type="submit">Download CSV</button>
          <p id="export-count" class="export-count"></p>
          <p id="export-error" class="form-error" role="alert" hidden></p>
        </form>
      </section>
    </div>
  </main>

  <!-- Suggestions for every tag field: the tags used so far -->
  <datalist id="tag-options"></datalist>

  <script src="js/time.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/pages.js"></script>
  <script src="js/reports.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
