<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Time Tracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app-header">
    <h1>Time Tracker</h1>
  </header>

  <main class="app">
    <section class="timer-bar" aria-label="Timer">
      <input id="description" class="timer-description" type="text"
             placeholder="What are you working on?" autocomplete="off">
      <span id="clock" class="timer-clock">0:00:00</span>
      <button id="start-stop" class="button button-primary" type="button">Start</button>
    </section>

    <details class="manual-entry">
      <summary>Add an entry by hand</summary>
      <form id="manual-form" class="manual-form" novalidate>
        <label class="manual-description">
          Description
          <input name="description" type="text" class="edit-field" autocomplete="off"
                 placeholder="What did you work on?">
        </label>
        <label>
          Date
          <input name="date" type="date" class="edit-field">
        </label>
        <label>
          Start
          <input name="start" type="time" class="edit-field">
        </label>
        <label>
          End
          <input name="end" type="time" class="edit-field">
        </label>
        <button class="button button-primary" type="submit">Add</button>
      </form>
    </details>

    <section class="entries" aria-label="Entries">
      <div class="entries-header">
        <h2>Entries</h2>
        <p class="today-total">Today <strong id="today-total">0:00:00</strong></p>
      </div>
      <p id="empty-message" class="empty-message">No entries yet.</p>
      <table id="entries-table" class="entries-table" hidden>
        <thead>
          <tr>
            <th>Description</th>
            <th>Date</th>
            <th>Start</th>
            <th>End</th>
            <th class="duration">Duration</th>
            <th class="actions"><span class="visually-hidden">Actions</span></th>
          </tr>
        </thead>
        <tbody id="entries-body"></tbody>
      </table>
    </section>
  </main>

  <script src="js/time.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
